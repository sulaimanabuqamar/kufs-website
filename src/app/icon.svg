<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Favicon. A tab icon has to survive 16px, where the full KUFS lockup is an
    illegible smear, so this is a reduction: KUFS Navy ground, the wordmark's
    italic "K", and the speed stripe in Racing Red / Desert Copper /
    Performance Orange.

    Colours are literals because an SVG favicon cannot resolve CSS custom
    properties. They mirror --color-surface, --color-stripe-* and --color-text
    in src/styles/tokens.css — update both together.

    TODO(brand): ask the design lead for an official square/app mark. This is a
    faithful reduction, not an approved lockup.
  -->
  <rect width="32" height="32" rx="6" fill="#25225E"/>
  <path fill="#FFFFFF" d="M12.9 5.5h5.2l-4.3 8.2 6.5 9.1h-5.6l-4.6-7.1-1.4 7.1H4l3.6-17.3h4.7l-1.3 6.4Z"/>
  <g>
    <rect x="5" y="24.4" width="22" height="1.5" rx="0.6" fill="#AC2A26" transform="skewX(-20)"/>
    <rect x="6" y="26.4" width="21" height="1.5" rx="0.6" fill="#DF964E" transform="skewX(-20)"/>
    <rect x="7" y="28.4" width="20" height="1.5" rx="0.6" fill="#EDAD55" transform="skewX(-20)"/>
  </g>
</svg>
