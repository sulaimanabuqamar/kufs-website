name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Playwright's browsers are only needed by the `hero` job, which installs
  # them explicitly. Keep them out of every other install.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  quality:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Re-measures every contrast ratio claimed in src/styles/tokens.css and
      # enforces that Racing Red stays below 3:1 on dark. The comments in the
      # token file are the site's accessibility contract; this keeps them true.
      - name: Check contrast claims
        run: pnpm check:contrast

      # A4 Speed is free for personal use only, and this repository is public,
      # so committing the binary is redistribution regardless of what the site
      # serves. Fails if any font binary is tracked without a licence
      # certificate beside it. See the Licensing section of README.md.
      - name: Check font licence
        run: pnpm check:font-licence

      # The /admin panel's fields are compiled from the Zod schemas rather than
      # written by hand, so they cannot drift. This checks the two things that
      # still can: that the compiler handles every schema (it throws rather
      # than guessing), and that the hand-written labels in tina/overlays.ts
      # still point at fields that exist. It also diffs the generated field
      # tree against a committed snapshot, so a schema change shows up in
      # review as a change to what editors will see.
      - name: Check admin panel matches the content schemas
        run: pnpm check:tina

      # Every user-visible word on the site is editable from /admin. This is
      # what stops the next feature quietly reintroducing a hardcoded heading
      # and turning the panel from "edit anything" into "edit the parts nobody
      # has touched since August". The self-test runs first, because a green
      # run from a check nobody has seen fail is not evidence of anything.
      - name: Check no copy is hardcoded
        run: |
          node scripts/check-copy.mjs --self-test
          pnpm check:copy

      # Also the content gate: every file under /content is parsed through its
      # Zod schema during the build, so a malformed sponsor or milestone fails
      # here rather than in production.
      - name: Build
        run: pnpm build

      # Fails if the home page crosses its gzipped JS budget, or if a
      # server-only dependency (Zod, gray-matter) or three.js has leaked into
      # the client bundle.
      - name: Check JS budget
        run: pnpm check:bundle

      - name: Upload build output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 3

  runtime:
    name: Hero behaviour and brand rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      # check:glyphs walks every display-face string in the rendered DOM and
      # fails on any character A4 Speed does not map — it covers U+0020-U+007E
      # only, so an em dash or a curly apostrophe in a heading falls through to
      # a different typeface mid-word. Coverage comes from the committed cmap
      # manifest here, since the font binary is gitignored.
      #
      # Asserts the three hero paths against a real production server:
      # phones and reduced-motion visitors must download zero frames and get
      # no pinning; desktop must get the sequence. See scripts/check-hero.mjs.
      - name: Start server and verify hero + brand rules
        run: |
          pnpm start --port 3000 &
          npx --yes wait-on http://127.0.0.1:3000 --timeout 60000
          pnpm check:hero
          pnpm check:brand
          pnpm check:glyphs

      # Regression cover for the Next 16 scroll-behaviour bug: pages opening
      # partway down after a client-side navigation. Invisible to build,
      # typecheck and Lighthouse; only a real click reveals it.
      - name: Scroll position on navigation
        run: pnpm check:scroll

      # LCP < 2.0s on Fast 4G, < 3.0s on Slow 4G, CLS < 0.1, accessibility 100.
      # Runs Lighthouse through `pnpm dlx` so it is not a dependency of the repo.
      # Median of three, on a reduced page set. Lighthouse's simulated
      # throttling still depends on the runner's real CPU, and a single sample
      # on a shared runner is noisy enough to fail a budget it clears locally.
      - name: Performance and accessibility budgets
        # Invoked directly rather than through `pnpm check:perf --`: pnpm
        # forwards the `--` itself, which arrives as a positional argument and
        # parseArgs rejects it.
        run: node scripts/check-perf.mjs --runs 3 --paths "/,/become-a-sponsor,/team"
